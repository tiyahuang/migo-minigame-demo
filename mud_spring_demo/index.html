<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棉石泥漿島的噗噗泉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #10223a; --panel: #1b2f4a; --text: #e6f2ff; --muted: #94acc8; --accent: #3f7bff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, "Noto Sans TC", sans-serif;
    display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: center; padding: 24px 16px; }

  /* 390×844 手機畫面，座標照 Figma */
  .phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 28px; background: #7fd9e0;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); flex: none; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .stage { position: absolute; inset: -16px; }
  .stage > * { position: absolute; left: 16px; top: 16px; width: 390px; height: 844px; overflow: hidden; }
  canvas { pointer-events: none; }
  .scene { will-change: opacity; }
  .scene img { position: absolute; }
  .scene canvas { position: absolute; left: 0; top: 0; width: 390px; height: 844px; }

  /* 第 1 張：湖面（背景原圖 1024×1607 → Figma 位置 x -78，546×857） */
  .bg-lake { left: -78px; top: 0; width: 546px; height: 857px; }
  .raft { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 190px 551px; will-change: transform; }
  .raft img { position: absolute; }
  /* 浮島與倒影：從平靜湖面原圖裁切，原圖 → 畫面縮放 0.5579 */
  .island { left: 60.1px; top: 504.9px; width: 262.2px; height: 93.2px; }
  .island-reflection { left: 60.1px; top: 583px; width: 262.2px; height: 75.3px; }
  .bg-calm, .fg-mound { left: -90.5px; top: 0; width: 571.3px; height: 857px; }   /* 前景土丘：同一張原圖切出來，疊在泡泡上面 */
  .migo-calm { left: 8px; top: 241px; width: 373px; height: 373px; }      /* 含環境光，比對設計稿定位（硬邊陰影已去掉） */
  /* Migo 的地面陰影：柔和、會暈開（位置照 Figma MIGO ground shadow） */
  /* 表情：跟 B 版同一套圖（半瞇眼 / 暈眼），依 Migo 身體外框換算（A 版身體大 1.1 倍） */
  .migo-e2 { left: 114px; top: 386px; width: 159px; height: 155.1px; display: none; }
  .migo-e3 { left: 100.9px; top: 379.2px;   /* 暈眼原圖是歪頭的：已轉正 8°，兩眼中點對齊半瞇眼 */ width: 179.9px; height: 176.6px; display: none; }
  /* 身體一律用原本的 migo_calm（不變色），只把 B 版表情的臉罩疊上去 */
  .raft[data-e="2"] .migo-e2, .raft[data-e="3"] .migo-e3 { display: block; }
  .soft-shadow { position: absolute; left: 100px; top: 517px; width: 188px; height: 36px; border-radius: 50%;   /* 放在 Migo 腳底（身體底 y≈540），比身體寬一點才看得到 */
    background: radial-gradient(ellipse at center, rgba(100,25,95,.5) 0%, rgba(100,25,95,.3) 45%, rgba(100,25,95,0) 72%); filter: blur(3px); }

  /* 第 2、3 張：噴發（同一張長圖，第 3 張是鏡頭推近） */
  #geyserScene, #resultScene { opacity: 0; }
  #geyserScene { background: #40b8cc; }   /* 第 3 張背景圖從 y=72 開始，上方是 Figma 的底色 */
  #gcam { position: absolute; left: -77px; top: 0; width: 574px; height: 1068px; transform-origin: 0 0; will-change: transform; }
  #gcam img { left: 0; top: 0; width: 100%; height: 100%; }
  #dizzy { left: 32px; top: 72px; width: 200px; height: 198.5px; transform-origin: 100px 99.5px; will-change: transform, opacity; }

  /* 第 4 張：結算 */
  #resultScene { pointer-events: none; font-family: Inter, system-ui, sans-serif; text-align: center; }
  #resultScene.on { pointer-events: auto; }
  #resultScene > * { position: absolute; }
  .r-ko { left: 148.2px; top: 600px; width: 242px; height: 244.5px; }
  .r-label { left: 0; right: 0; top: 156px; font-size: 18px; line-height: 24px; font-weight: 700; color: #fff; letter-spacing: .02em;
    text-shadow: 0 1px 8px rgba(20,60,120,.25); }
  .r-value { left: 0; right: 0; top: 190px; font-size: 118px; line-height: 128px; font-weight: 900; color: #1d55ee; letter-spacing: -.01em; }
  .r-card { left: 24px; top: 431px; width: 342px; height: 196px; border-radius: 22px;
    background: rgba(255,255,255,.38); border: 1px solid rgba(255,255,255,.7);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(40,90,140,.18); }
  .r-card > * { position: absolute; }
  .r-title { left: 0; right: 0; top: 24px; font-size: 21px; line-height: 28px; font-weight: 700; color: #1f2b48; }
  .r-copy { left: 25px; right: 25px; top: 58px; font-size: 14px; line-height: 20px; color: #3c4a68; }
  .r-play { left: 69px; top: 123px; width: 140px; height: 48px; cursor: pointer; }
  .r-share { left: 215px; top: 113px; width: 68px; height: 68px; }

  .flash { pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 80%, #ffffff 0%, #e6fffb 40%, rgba(190,250,245,.9) 100%); }

  .hud { position: absolute; left: 0; right: 0; top: 156px; height: 195px; text-align: center; pointer-events: none; z-index: 5;
    font-family: Inter, "Arial Black", system-ui, sans-serif; }
  .hud .title { margin-top: 2px; font-size: 18px; font-weight: 700; letter-spacing: .02em; color: #fff; text-shadow: 0 1px 8px rgba(20,60,120,.25); }
  .hud .num { margin-top: 0; font-size: 104px; line-height: 1.12; font-weight: 900; color: #1d55ee; display: inline-block; }
  .num.pop { animation: pop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .header { position: absolute; left: 0; top: 0; width: 390px; height: 116px; z-index: 6; pointer-events: none; }
  .tip { position: absolute; left: 0; right: 0; bottom: calc(30px + var(--cropB, 0px)); text-align: center; font-size: 13px; color: rgba(255,255,255,.9);
    text-shadow: 0 1px 4px rgba(0,60,90,.5); z-index: 6; pointer-events: none; transition: opacity .4s; }

  .panel { width: 300px; background: var(--panel); border-radius: 16px; padding: 18px 18px 8px; max-height: 844px; overflow: auto; }
  .panel h1 { font-size: 16px; margin: 0 0 4px; }
  .panel h2 { font-size: 13px; margin: 18px 0 10px; color: #7fb0ff; }
  .panel p { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .row { margin-bottom: 12px; }
  .row label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .row label span { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row input { width: 100%; accent-color: var(--accent); }
  .btns { display: flex; gap: 8px; margin-bottom: 10px; }
  button { flex: 1; background: #26405f; color: var(--text); border: 0; border-radius: 10px; padding: 9px; font-size: 13px; cursor: pointer; }
  button:hover { background: #31517a; }
  button.primary { background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; padding: 12px; }

  @media (max-width: 760px) {
    body { padding: 0; gap: 0; }
    .phone { border-radius: 0; }
    .panel { width: 100%; max-width: 390px; border-radius: 0; max-height: none; }
  }

  /* 公開模式：沒有 ?dev 時只顯示遊戲畫面，並縮放到剛好塞進螢幕 */
  body:not(.dev) .panel { display: none; }
  body:not(.dev) { display: block; padding: 0; height: 100vh; height: 100dvh; overflow: hidden; }
  body:not(.dev) .phone { flex: none; transform-origin: center center; }

  /* 極簡捲軸：沒有軌道底色，只有一條可以拖的細條 */
  .panel { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.28) transparent; }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); border-radius: 3px; }
  .panel::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.45); }
  .panel::-webkit-scrollbar-button { display: none; height: 0; }
  /* 參數面板開關按鈕 */
  .panel-toggle { position: fixed; top: 12px; right: 12px; z-index: 50; flex: none; width: auto;
    padding: 8px 14px; border-radius: 999px; border: 0; font-size: 13px; font-weight: 700; cursor: pointer;
    background: rgba(20, 20, 40, .55); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .panel-toggle:hover { background: rgba(20, 20, 40, .75); }

  /* 遊戲切換鈕 */
  .game-switch { position: fixed; top: 12px; left: 12px; z-index: 50; display: flex; padding: 3px; gap: 2px;
    border-radius: 999px; background: rgba(20, 20, 40, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font: 700 13px/1 system-ui, "Noto Sans TC", sans-serif; }
  .game-switch a { padding: 7px 0; width: 32px; text-align: center; border-radius: 999px; color: rgba(255,255,255,.75); text-decoration: none; white-space: nowrap; }
  .game-switch a:hover { color: #fff; }
  .game-switch a.on { background: rgba(255,255,255,.92); color: #1d1a3a; }

  /* AB toggle：白色圓鈕是 ::before，點整顆就滑到另一邊並切換遊戲 */
  .game-switch { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .game-switch::before { content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: 32px; border-radius: 999px;
    background: rgba(255,255,255,.92); transition: transform .18s ease; }
  .game-switch.b::before { transform: translateX(34px); }
  .game-switch a { position: relative; z-index: 1; transition: color .18s; }
  .game-switch a.on { background: none; color: #1d1a3a; }

  /* 手機：遊戲滿版，按鈕浮在畫面上，參數面板是蓋在上面的抽屜 */
  @media (max-width: 760px) {
    /* 手機：遊戲撐滿整個瀏覽器（fit() 裡算縮放和裁切），參數打開時面板接在下面，往下捲就看得到 */
    body, body.dev { display: block; padding: 0; overflow-x: hidden; }
    body:not(.dev) { height: 100vh; height: 100dvh; overflow: hidden; }
    body.dev { height: auto; overflow-y: auto; }
    body.dev .panel { width: 100%; max-width: none; max-height: none; overflow: visible; border-radius: 0; }
    .game-switch, .panel-toggle { top: 8px; }
    .game-switch { left: 8px; }
    .panel-toggle { right: 8px; }
  }

  /* 右上角：畫面比例切換（等比／填滿）+ 參數鈕 */
  .top-right { position: fixed; top: 12px; right: 12px; z-index: 50; display: flex; gap: 6px; align-items: center; }
  .top-right .panel-toggle { position: static; }
  .fit-switch { position: relative; display: flex; gap: 2px; padding: 3px; border: 0; border-radius: 999px; cursor: pointer;
    background: rgba(20, 20, 40, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font: 700 12px/1 system-ui, "Noto Sans TC", sans-serif; -webkit-tap-highlight-color: transparent; }
  .fit-switch::before { content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: 40px; border-radius: 999px;
    background: rgba(255,255,255,.92); transition: transform .18s ease; }
  .fit-switch.fill::before { transform: translateX(42px); }
  .fit-switch span { position: relative; z-index: 1; width: 40px; padding: 7px 0; text-align: center; color: rgba(255,255,255,.75); transition: color .18s; }
  .fit-switch:not(.fill) span:first-child, .fit-switch.fill span:last-child { color: #1d1a3a; }
  @media (max-width: 760px) { .top-right { top: 8px; right: 8px; } }
</style>
</head>
<body>


<nav class="game-switch" aria-label="切換遊戲">
  <a href="../mud_spring_demo/" class="on" aria-current="page" title="棉石泥漿島的噗噗泉">A</a>
  <a href="../migo_float_test/" title="綿綿洞窟的神秘泉水">B</a>
</nav>

<div class="phone" id="phone">
  <div class="stage" id="stage">
    <!-- 第 1 張：湖面 -->
    <div class="scene" id="lakeScene">
      <img class="bg-calm" src="assets/bg_lake_calm.png" alt="">
      <canvas id="lakeBack"></canvas>
      <div class="raft" id="raft">
        <img class="island-reflection" src="assets/island_reflection.png" alt="">
        <img class="island" src="assets/island.png" alt="">
        <div class="soft-shadow"></div>
        <img class="migo-calm" id="migoCalm" src="assets/migo_calm.png" alt="Migo">
        <img class="migo-e2" src="assets/face_e2.png" alt="">
        <img class="migo-e3" src="assets/face_e3.png" alt="">
      </div>
      <canvas id="lakeFront"></canvas>
      <img class="fg-mound" src="assets/fg_mound.png" alt="">
    </div>
    <!-- 第 2、3 張：噴發 + 鏡頭推近 -->
    <div class="scene" id="geyserScene">
      <div id="gcam"><img src="assets/bg_geyser.png" alt=""></div>
      <canvas id="geyserFx"></canvas>
      <img id="dizzy" src="assets/migo_ko_small.png" alt="Migo">
    </div>
    <!-- 第 4 張：結算（靜態） -->
    <div class="scene" id="resultScene">
      <img class="bg-lake" src="assets/bg_lake.png" alt="">
      <div class="r-label">SECRET NUMBER</div>
      <div class="r-value" id="resultNum">10</div>
      <div class="r-card">
        <div class="r-title">You set off the Pop!</div>
        <div class="r-copy">It was <span id="resultShakes">10</span> shakes to Pop! Better luck next round.</div>
        <img class="r-play" id="resultReplay" src="assets/btn_play.png" alt="Play again">
        <img class="r-share" src="assets/btn_share.png" alt="Share">
      </div>
      <img class="r-ko" id="resultKo" src="assets/migo_ko_result.png" alt="Migo">
    </div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="hud" id="hud">
    <div class="title">TOTAL SHAKES</div>
    <div class="num" id="num">0</div>
  </div>
  <img class="header" src="assets/header.png" alt="">
  <div class="tip" id="tip">點畫面 / 按空白鍵 = 搖一下</div>
</div>

<div class="panel">
  <h1>棉石泥漿島的噗噗泉</h1>
  <p>點手機畫面、按空白鍵，或按下方按鈕來搖。滑桿可即時調整。</p>
  <div class="btns"><button class="primary" id="shakeBtn">搖一下</button></div>
  <div class="btns">
    <button id="restart">重來</button>
    <button id="skip">直接看噴發</button>
    <button id="pause">暫停</button>
  </div>
  <div class="btns"><button id="motion">啟用手機搖晃</button></div>
  <h2>搖晃</h2>
  <div id="sliders-shake"></div>
  <h2>噴發</h2>
  <div id="sliders-erupt"></div>
  <div class="btns"><button id="reset">參數重設</button></div>
</div>

<script>
// ================= 可調參數 =================
const P = {
  total:      { g: 'shake', v: 10,  min: 1,   max: 30,  step: 1,    label: '要搖幾下', restart: true },
  driftMax:   { g: 'shake', v: 38,  min: 0,   max: 80,  step: 1,    label: '搖晃時浮島被推遠的距離 (px)' },
  tiltMax:    { g: 'shake', v: 4,   min: 0,   max: 15,  step: 0.5,  label: '浮島不穩的晃動角度 (°)' },
  bobAmp:     { g: 'shake', v: 3,   min: 0,   max: 12,  step: 0.5,  label: '浮島上下起伏 (px)' },
  rockKick:   { g: 'shake', v: 9,   min: 0,   max: 30,  step: 1,    label: '每搖一下浮島被推的力道' },
  steam:      { g: 'shake', v: 9,   min: 0,   max: 20,  step: 1,    label: '冒煙量（越搖越多）' },
  bubbleRate: { g: 'shake', v: 6,   min: 0,   max: 30,  step: 1,    label: '湖面冒泡頻率（越搖越多）' },
  burst:      { g: 'shake', v: 5,   min: 0,   max: 20,  step: 1,    label: '每搖一下冒出的泥漿泡' },
  expr2At:    { g: 'shake', v: 4,   min: 1,   max: 30,  step: 1,    label: '搖到第幾下換半瞇眼' },
  expr3At:    { g: 'shake', v: 8,   min: 1,   max: 30,  step: 1,    label: '搖到第幾下換暈眼' },
  screenShake:{ g: 'shake', v: 6,   min: 0,   max: 16,  step: 1,    label: '畫面震動 (px)' },
  rumbleSec:  { g: 'erupt', v: 1.4, min: 0.2, max: 4,   step: 0.1,  label: '最後一下後瘋狂震動 (秒)' },
  rumbleMax:  { g: 'erupt', v: 16,  min: 0,   max: 30,  step: 1,    label: '瘋狂震動最大幅度 (px)' },
  outSec:     { g: 'erupt', v: 1.6, min: 0.4, max: 4,   step: 0.1,  label: 'Migo 飛出畫面 (秒，越大越慢)' },
  hold3Sec:   { g: 'erupt', v: 0.5, min: 0.1, max: 4,   step: 0.1,  label: '飛出後到結算頁 (秒)' },
};
const DEFAULTS = Object.fromEntries(Object.entries(P).map(([k, o]) => [k, o.v]));
for (const [k, o] of Object.entries(P)) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${o.label}<span id="v_${k}">${o.v}</span></label>
    <input type="range" id="s_${k}" min="${o.min}" max="${o.max}" step="${o.step}" value="${o.v}">`;
  document.getElementById('sliders-' + o.g).appendChild(row);
  row.querySelector('input').addEventListener('input', e => {
    o.v = parseFloat(e.target.value);
    document.getElementById('v_' + k).textContent = o.v;
    if (o.restart) restart();
  });
}

// ================= 常數 / 狀態 =================
const W = 390, H = 844, TAU = Math.PI * 2;
const ISLAND = { x: 190, y: 551 };              // 新的平靜湖面圖裡浮島的中心（畫面座標）
const WATERLINE = 590;                          // 浮島吃水線（畫面座標）
// 平靜湖面圖 1024×1536：Figma 以填滿方式放在 (-78,0) 546×857 → 實際 x -90.5、寬 571.3
const CALM = { x: -90.5, y: 0, w: 571.3, h: 857 };
const CAM2 = { x: -77, y: 0, w: 574 };       // 第 2 張背景位置
const CAM3 = { x: -173, y: 72, w: 914 };     // 第 3 張背景位置（同一張圖放大）
const S = { phase: 'lake', pt: 0, t: 0, count: 10, push: 0, pushV: 0, dip: 0, dipV: 0, energy: 0, shakeT: 0, shakeK: 0, rx: 0, ry: 0 };
const muds = [], rings = [], drops = [], steams = [];

const clamp01 = v => Math.min(Math.max(v, 0), 1);
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutCubic = k => 1 - (1 - k) ** 3;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
const easeOutBack = k => { const c = 1.6; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; };
const shakesDone = () => P.total.v - S.count;
const progress = () => shakesDone() / P.total.v;

function setupCanvas(id) {
  const c = document.getElementById(id), dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  return ctx;
}
const back = setupCanvas('lakeBack'), front = setupCanvas('lakeFront'), gfx = setupCanvas('geyserFx');

// ================= 湖面效果 =================
// 透視：越下面越近、越大
const depth = y => clamp01((y - 470) / 330) * 0.85 + 0.3;

// 泥漿湖面的範圍：從背景圖算出來（青綠色 = 泥漿；粉紫色地面、遠方山丘都不算）
let lakeMask = null;
function buildLakeMask() {
  const img = document.querySelector('#lakeScene .bg-calm');
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(img, CALM.x, CALM.y, CALM.w, CALM.h);
  const d = x.getImageData(0, 0, W, H).data;
  lakeMask = new Uint8Array(W * H);
  for (let y = 490; y < H; y++) for (let i = 0; i < W; i++) {
    const k = (y * W + i) * 4, r = d[k], g = d[k + 1], b = d[k + 2];
    lakeMask[y * W + i] = (g - r > 45 && g > 185 && b > 185) ? 1 : 0;
  }
}
const inLake = (x, y) => { x |= 0; y |= 0; return lakeMask && x >= 0 && y >= 0 && x < W && y < H && lakeMask[y * W + x] === 1; };

function spawnMud(big) {
  for (let i = 0; i < 20; i++) {
    const x = 15 + Math.random() * 360, y = 495 + Math.random() * 300;
    // 大小有變化：大部分小顆，偶爾來一顆大的（大的鼓更久）
    const roll = Math.random();
    const base = roll < 0.15 ? 50 + Math.random() * 30 : roll < 0.45 ? 28 + Math.random() * 18 : 11 + Math.random() * 14;   // 整體再大一點
    const s = depth(y), rMax = base * (big ? 1.15 : 0.85) * s;
    // 整顆泡泡的底部都要在泥漿裡、也不要在浮島正下方
    if (!inLake(x - rMax, y) || !inLake(x + rMax, y) || !inLake(x, y + rMax * 0.3) || !inLake(x, y - 4)) continue;
    if (Math.abs(x - (ISLAND.x + S.rx)) < 150 && Math.abs(y - ISLAND.y - 25) < 55) continue;
    muds.push({ x, y, s, r: 0, rMax, t: 0, grow: (0.7 + Math.random() * 0.6) * (0.7 + rMax / 40) });   // 泥漿黏稠，鼓得慢；越大越慢
    return;
  }
}
// 熱氣：從湖面中間冒出來，慢慢往上飄、變大、變淡
function spawnSteam() {
  for (let i = 0; i < 10; i++) {
    const x = 50 + Math.random() * 290, y = 520 + Math.random() * 190;
    if (!inLake(x, y)) continue;
    // 一路往上竄到數字那一帶（約 y 250）才散掉：從湖面升約 300px，壽命 5～6.5 秒
    const s = depth(y), life = 5 + Math.random() * 1.5;
    const rise = (y - (230 + Math.random() * 60)) / life;
    steams.push({ x, y, r: (20 + Math.random() * 22) * s, vx: (Math.random() - 0.5) * 8, life, max: life,
      front: y > ISLAND.y + 40 && Math.random() < 0.6, ph: Math.random() * TAU, rise });
    return;
  }
}
function popMud(m) {
  // 濃稠的破法：一圈粗粗的泥漿環慢慢擴散，濺起少量、慢、不透明的泥漿團
  rings.push({ x: m.x, y: m.y, r: m.rMax * 1.15, s: m.s, life: 1.4, max: 1.4, thick: true });   // 大圈、慢慢擴散
  const n = m.rMax > 14 ? 3 + (Math.random() * 2 | 0) : 1 + (Math.random() * 2 | 0);
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.4, sp = (45 + Math.random() * 55) * Math.sqrt(m.s) * (0.6 + m.rMax / 40);
    drops.push({ x: m.x + (Math.random() - 0.5) * m.rMax * 0.6, y: m.y - m.rMax * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: (2.2 + Math.random() * 2.6) * m.s * (0.7 + m.rMax / 50), g: 300, floor: m.y + 2, life: 2, goo: true, s: m.s });
  }
  if (Math.random() < 0.5) steams.push({ x: m.x, y: m.y - 8, r: 14 * m.s, vx: 0, life: 2.2, max: 2.2, front: m.y > ISLAND.y + 40, ph: Math.random() * TAU });
}
function glow(ctx, x, y, r, a) {
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, 0, x, y, r);
  g.addColorStop(0, `rgba(255,255,255,${a})`);
  g.addColorStop(0.5, `rgba(190,250,245,${a * .8})`);
  g.addColorStop(1, `rgba(120,225,225,${a * .1})`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function drawMud(ctx, m) {
  // 從湖面鼓起的半球泥漿泡（薄荷色）；破掉時先塌陷攤平再融回泥漿
  const k = m.popped ? clamp01(m.pt / 0.45) : 0;
  const r = m.r * (1 + 0.35 * k), h = m.r * 0.85 * (1 - 0.85 * k);
  const A = 1 - k * k;
  ctx.save();
  ctx.globalAlpha = A;
  const g = ctx.createLinearGradient(m.x, m.y - h, m.x, m.y);
  g.addColorStop(0, 'rgba(200,252,248,0.95)');
  g.addColorStop(0.6, 'rgba(130,228,226,0.92)');
  g.addColorStop(1, 'rgba(100,206,214,0.8)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(m.x, m.y, r, Math.max(h, 0.5), 0, Math.PI, TAU);
  ctx.ellipse(m.x, m.y, r, r * 0.25, 0, 0, Math.PI);
  ctx.fill();
  // 柔和的高光（模糊光暈，不要銳利白點）
  if (h > 2) {
    const hx = m.x - r * 0.32, hy = m.y - h * 0.58, hr = r * 0.42;
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
    hg.addColorStop(0, 'rgba(255,255,255,0.55)');
    hg.addColorStop(0.45, 'rgba(255,255,255,0.22)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.7 * (h / (m.r * 0.85 + 0.01)), -0.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawGoo(ctx, d) {
  // 濃稠的泥漿團：不透明薄荷色 + 柔和高光
  const g = ctx.createRadialGradient(d.x - d.r * 0.35, d.y - d.r * 0.35, 0, d.x, d.y, d.r);
  g.addColorStop(0, 'rgba(225,255,252,0.98)');
  g.addColorStop(0.55, 'rgba(150,234,230,0.96)');
  g.addColorStop(1, 'rgba(110,212,218,0.9)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r * 0.92, d.r * 1.08, 0, 0, TAU); ctx.fill();
}
function drawSteam(ctx, s) {
  // 一縷往上飄的熱氣：底部窄、往上變寬變淡
  const k = 1 - s.life / s.max;                       // 0 → 1
  const a = 0.4 * Math.sin(Math.PI * Math.min(1, k * 1.15)) * (1 - k * 0.3);
  const rr = s.r * (0.7 + k * 3.2);
  const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rr);
  g.addColorStop(0, `rgba(255,255,255,${a})`);
  g.addColorStop(0.5, `rgba(248,255,255,${a * 0.55})`);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(s.x, s.y, rr * 0.8, rr * 1.5, Math.sin(S.t * 0.6 + s.ph) * 0.25, 0, TAU); ctx.fill();
}
function drawRing(ctx, r) {
const k = r.life / (r.max || 0.6);
    if (r.thick) {                                       // 濃稠的泥漿環：粗、慢、帶亮邊
      const rr = r.r * (1 + (1 - k) * (r.exp || 2.1));
      ctx.strokeStyle = `rgba(150,232,228,${0.85 * k})`; ctx.lineWidth = (3.5 + 8 * k) * r.s;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr * 0.28, 0, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(240,255,255,${0.45 * k})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(r.x, r.y - 1.5 * r.s, rr, rr * 0.28, 0, Math.PI, TAU); ctx.stroke();
    } else {
      const rr = r.r * (1 + (1 - k) * 2.2);
      ctx.strokeStyle = `rgba(235,255,255,${0.7 * k})`; ctx.lineWidth = 1.5 * r.s;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr * 0.28, 0, 0, TAU); ctx.stroke();
    }
  
}
function drawLake() {
  back.clearRect(0, 0, W, H); front.clearRect(0, 0, W, H);
  // 浮島四周的漣漪：跟著浮島走，也順便蓋住底下補過的地方
  const ix = ISLAND.x + S.rx, iy = ISLAND.y + 30 + S.ry;
  back.save();
  // 一次一圈：從浮島中心冒出來往外擴，快消失時下一圈才出現
  const RT = 3.0, RL = 3.5, base = S.t % RT;
  for (const age of [base, base + RT]) {
    if (age >= RL) continue;
    const k = age / RL;
    const rx = 15 + k * 200;
    const a = Math.min(1, k / 0.12) * (1 - k);         // 跟泡泡破掉的漣漪一樣：粗、濃稠、帶亮邊
    back.strokeStyle = `rgba(150,232,228,${0.75 * a})`; back.lineWidth = 3 + 8 * a;
    back.beginPath(); back.ellipse(ix, iy, rx, rx * 0.24, 0, 0, TAU); back.stroke();
    back.strokeStyle = `rgba(240,255,255,${0.45 * a})`; back.lineWidth = 1;
    back.beginPath(); back.ellipse(ix, iy - 1.5, rx, rx * 0.24, 0, Math.PI, TAU); back.stroke();
  }
  back.restore();
  for (const s of steams) if (!s.front) drawSteam(back, s);
  // 泡泡和破掉的漣漪依 y 排序：越下面（越靠近鏡頭）越後畫，疊在越前面
  const items = [];
  for (const r of rings) items.push({ y: r.y, ring: r });
  for (const m of muds) items.push({ y: m.y, mud: m });
  items.sort((p, q) => p.y - q.y);
  for (const it of items) {
    const ctx = it.y > ISLAND.y + 30 ? front : back;
    it.ring ? drawRing(ctx, it.ring) : drawMud(ctx, it.mud);
  }



  for (const d of drops) d.goo ? drawGoo(front, d) : glow(front, d.x, d.y, d.r, 0.85);
  for (const s of steams) if (s.front) drawSteam(front, s);
}

// ================= 搖一下 =================
const numEl = document.getElementById('num');
function shake() {
  if (S.phase !== 'lake') return;
  S.count--;
  const p = progress();
  S.pushV += (Math.random() < 0.5 ? -1 : 1) * P.rockKick.v * (0.6 + p) * 5;   // 浮島被推往左或右
  S.rotV = (S.rotV || 0) + (Math.random() < 0.5 ? -1 : 1) * (35 + Math.random() * 35) * (0.6 + p);   // 被搖得歪一下
  S.nextMove = 0;                                  // 馬上換一個新的飄動目標
  S.dipV += 25;
  S.energy = 1;
  S.shakeT = 0.35; S.shakeK = P.screenShake.v;
  for (let i = 0; i < P.burst.v * (1 + p); i++) spawnMud(true);
  rings.push({ x: ISLAND.x + S.rx, y: ISLAND.y + 30, r: 30, s: 1.2, life: 1.3, max: 1.3, thick: true, exp: 5.5 });   // 搖一下：浮島底下推出一圈濃稠的大漣漪
  numEl.textContent = shakesDone();
  numEl.classList.remove('pop'); void numEl.offsetWidth; numEl.classList.add('pop');
  document.getElementById('tip').style.opacity = 0;
  if (navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate(40);
  if (S.count <= 0) setPhase('rumble');
}

function setPhase(p) { S.phase = p; S.pt = 0; if (p !== 'lake') document.getElementById('tip').style.opacity = 0; }
const scenes = { lake: lakeScene, geyser: geyserScene, result: resultScene };
const scene = (n, o) => scenes[n].style.opacity = o;

function setCam(c) {
  const sc = c.w / 574;
  gcam.style.transform = `translate(${(c.x - CAM2.x).toFixed(1)}px, ${(c.y - CAM2.y).toFixed(1)}px) scale(${sc.toFixed(4)})`;
}

function restart() {
  setPhase('lake');
  Object.assign(S, { count: P.total.v, push: 0, pushV: 0, dip: 0, dipV: 0, energy: 0, shakeT: 0, rx: 0, ry: 0, rot: 0, rotV: 0, target: 0, nextMove: 0 });
  muds.length = rings.length = drops.length = steams.length = 0;
  numEl.textContent = 0;
  hud.style.opacity = 1;
  document.getElementById('tip').style.opacity = 1;
  scene('lake', 1); scene('geyser', 0); scene('result', 0);
  resultScene.classList.remove('on');
  flash.style.opacity = 0;
  setCam(CAM2);
  dizzy.style.opacity = 1; dizzy.style.transform = '';

  resultKo.style.transform = 'translate(110px, 270px) rotate(18deg)';
}
function skipToErupt() { restart(); S.count = 0; numEl.textContent = shakesDone(); setPhase('rumble'); }

// ================= 主迴圈 =================
const raft = document.getElementById('raft'), stage = document.getElementById('stage');
const hud = document.getElementById('hud'), flash = document.getElementById('flash');
let last = performance.now(), paused = false, ambient = 0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!paused) step(dt);
  requestAnimationFrame(frame);
}

function stepParticles(dt) {
  for (let i = muds.length - 1; i >= 0; i--) {
    const m = muds[i]; m.t += dt; m.r = m.rMax * easeOutCubic(clamp01(m.t / m.grow));
    if (!m.popped && m.t > m.grow + 0.25) { m.popped = true; m.pt = 0; popMud(m); }   // 鼓到最大後多撐一下才破
    if (m.popped && (m.pt += dt) > 0.45) muds.splice(i, 1);                            // 塌陷攤平後消失
  }
  for (let i = rings.length - 1; i >= 0; i--) if ((rings[i].life -= dt) <= 0) rings.splice(i, 1);
  for (let i = steams.length - 1; i >= 0; i--) {
    const s = steams[i];
    s.y -= (s.rise || 18) * dt; s.x += (s.vx + Math.sin(S.t * 0.8 + s.ph) * 7) * dt;
    if ((s.life -= dt) <= 0) steams.splice(i, 1);
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.vy += d.g * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt;
    const landed = d.floor && d.vy > 0 && d.y > d.floor;
    if (landed && d.goo) rings.push({ x: d.x, y: d.floor, r: d.r * 1.6, s: d.s || 1, life: 0.7, max: 0.7, thick: true });  // 泥漿團落回去
    if (d.life <= 0 || landed || d.y > H + 30) drops.splice(i, 1);
  }
}

const raftEl = document.getElementById('raft');
function step(dt) {
  S.t += dt; S.pt += dt;
  const ph = S.phase, p = progress();

  if (ph === 'lake' || ph === 'rumble') {
    const done = shakesDone();              // 表情跟 B 版一樣：開心 → 半瞇眼 → 暈眼（瘋狂震動時一定是暈眼）
    raftEl.dataset.e = (ph === 'rumble' || done >= P.expr3At.v) ? '3' : done >= P.expr2At.v ? '2' : '1';
    let rk = 0;
    if (ph === 'rumble') {                     // 瘋狂震動：泥漿狂滾、浮島東倒西歪
      rk = clamp01(S.pt / P.rumbleSec.v);
      S.shakeT = 0.35; S.shakeK = P.rumbleMax.v * (0.25 + 0.75 * rk * rk);
      if (Math.random() < 0.5 + rk) spawnMud(true);
      if (Math.random() < 0.08) S.pushV += (Math.random() - 0.5) * 140;
      hud.style.opacity = (1 - rk).toFixed(3);
      if (S.pt >= P.rumbleSec.v) {
        flash.style.opacity = 0.9;
        scene('lake', 0); scene('geyser', 1);
        setPhase('fly');
      }
    }
    // 平常冒泡，越搖越多
    ambient += dt * P.bubbleRate.v * (0.3 + 1.7 * p);
    while (ambient > 1) { ambient--; spawnMud(false); }
    stepParticles(dt);

    // 熱氣：一直有，越搖越多
    S.steamAcc = (S.steamAcc || 0) + dt * P.steam.v * (0.5 + 1.5 * p + (ph === 'rumble' ? 2 : 0));
    while (S.steamAcc > 1) { S.steamAcc--; spawnSteam(); }

    // 浮島：平常幾乎在原地、只有不穩地晃；被搖的時候才會被推著飄遠，飄的方向和停頓每次都不一樣
    if (ph === 'rumble') S.energy = 1;
    S.energy *= Math.exp(-dt * 0.45);                    // 搖完之後慢慢平靜下來
    if ((S.nextMove = (S.nextMove ?? 0) - dt) <= 0) {
      S.nextMove = 1.2 + Math.random() * 2.6;
      S.target = Math.random() < 0.35 ? S.push            // 有時停著不動
        : (Math.random() * 2 - 1) * P.driftMax.v * (0.1 + 0.9 * S.energy);
    }
    S.pushV += ((S.target ?? 0) - S.push) * 1.5 * dt - S.pushV * 2.0 * dt;   // 泥漿黏稠，慢慢飄過去
    S.push += S.pushV * dt;
    S.push = Math.max(-P.driftMax.v * 1.3, Math.min(P.driftMax.v * 1.3, S.push));
    S.dipV += (-S.dip * 12 - S.dipV * 3) * dt; S.dip += S.dipV * dt;
    // 不穩的晃動：幾個不同頻率疊在一起，越搖越晃
    S.rotV = (S.rotV || 0) + (-(S.rot || 0) * 18 - S.rotV * 2.6) * dt; S.rot = (S.rot || 0) + S.rotV * dt;
    const wob = (Math.sin(S.t * 2.1 + 0.3) * 0.55 + Math.sin(S.t * 3.3 + 1.1) * 0.3 + Math.sin(S.t * 5.3) * 0.15)
      * P.tiltMax.v * (0.35 + 0.65 * S.energy + 0.3 * p);
    S.rx = S.push;
    S.ry = Math.sin(S.t * 1.9) * P.bobAmp.v * (0.5 + 0.8 * S.energy) + S.dip * 0.15;
    raft.style.transform = `translate(${S.rx.toFixed(2)}px, ${S.ry.toFixed(2)}px) rotate(${(wob + S.rot).toFixed(2)}deg)`;
    drawLake();
  }

  else if (ph === 'fly') {
    // 噴發：Migo 從浮島被噴起來（一被拋飛就是打叉眼），邊轉邊往上飛出畫面頂端；鏡頭同時推近噴泉
    flash.style.opacity = (0.9 * (1 - clamp01(S.pt / 0.3))).toFixed(3);
    const k = clamp01(S.pt / P.outSec.v);
    const ey = 1 - (1 - k) * (1 - k);                  // 一開始最快、往上慢慢減速，但終點在畫面外
    const ep = easeInOut(clamp01(S.pt / (P.outSec.v + 0.25)));
    setCam({ x: lerp(CAM2.x, CAM3.x, ep), y: lerp(CAM2.y, CAM3.y, ep), w: lerp(CAM2.w, CAM3.w, ep) });
    // dizzy 元素的中心在 (132,171.5)：從浮島 (190,500) 出發，飛到畫面左上外 (95,-260)
    const cx = lerp(ISLAND.x, 95, ey), cy = lerp(500, -260, ey);
    dizzy.style.transform = `translate(${(cx - 132).toFixed(1)}px, ${(cy - 171.5).toFixed(1)}px) rotate(${lerp(-60, -620, ey).toFixed(1)}deg) scale(${lerp(0.55, 0.95, ey).toFixed(3)})`;
    dizzy.style.opacity = 1;
    S.shakeT = 0.35; S.shakeK = 12 * (1 - k);
    geyserSpray(dt, 1 - k * 0.5);
    if (S.pt >= P.outSec.v + 0.25) { gfx.clearRect(0, 0, W, H); setPhase('hold3'); }
  }
  else if (ph === 'hold3') {
    if (S.pt >= P.hold3Sec.v) {
      scene('geyser', 0); scene('result', 1); resultScene.classList.add('on');
      document.getElementById('resultNum').textContent = shakesDone();
      document.getElementById('resultShakes').textContent = shakesDone();
      flash.style.opacity = 0.8;
      setPhase('result');
    }
  } else if (ph === 'result') {               // 結算頁：其他都靜止，只有 Migo 從右下角冒出來
    flash.style.opacity = (0.8 * (1 - clamp01(S.pt / 0.35))).toFixed(3);
    const k = clamp01((S.pt - 0.3) / 0.65), e = easeOutBack(k);
    resultKo.style.transform = `translate(${lerp(110, 0, e).toFixed(1)}px, ${lerp(270, 0, e).toFixed(1)}px) rotate(${lerp(18, 0, e).toFixed(1)}deg)`;
  }

  if (S.shakeT > 0) {
    S.shakeT -= dt;
    const k = S.shakeK * Math.max(S.shakeT / 0.35, 0.3);
    // 震動時同時放大一點，放大量剛好蓋住位移，邊緣就不會露出底色
    const zs = 1 + (2 * k + 2) / 390;
    stage.style.transform = `translate(${((Math.random() - 0.5) * 2 * k).toFixed(1)}px, ${((Math.random() - 0.5) * 2 * k).toFixed(1)}px) scale(${zs.toFixed(4)})`;
  } else stage.style.transform = '';
}

// 噴發時水柱往上噴的水珠
const gdrops = [];
function geyserSpray(dt, amt) {
  for (let i = 0; i < 4 * amt; i++) gdrops.push({ x: 205 + (Math.random() - 0.5) * 50, y: 760, vx: (Math.random() - 0.5) * 160,
    vy: -700 - Math.random() * 600, r: 2 + Math.random() * 4, life: 1.2 });
  gfx.clearRect(0, 0, W, H);
  for (let i = gdrops.length - 1; i >= 0; i--) {
    const d = gdrops[i]; d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt;
    if (d.life <= 0) { gdrops.splice(i, 1); continue; }
    glow(gfx, d.x, d.y, d.r, 0.85 * clamp01(d.life / 0.6));
  }
}

document.getElementById('shakeBtn').onclick = shake;
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); shake(); } });
document.getElementById('restart').onclick = restart;
// 結算頁剛出現時，連點過來的那一下不要誤按到 Play again（不然會直接重開、計數跳回 1）
// 記錄每一下點擊的時間：連點中的那幾下不算「按 Play again」
let lastTapAt = 0, prevTapAt = 0;
document.getElementById('phone').addEventListener('pointerdown', () => { prevTapAt = lastTapAt; lastTapAt = performance.now(); }, true);
document.getElementById('resultReplay').onclick = () => {
  if (S.phase === 'result' && S.pt < 1.2) return;            // 結算頁剛出現：還在連點的手指不要直接重開
  if (performance.now() - prevTapAt < 400) return;           // 跟上一下間隔太短 = 還在連點，忽略；停下來再點一下才重開
  restart();
};
document.getElementById('skip').onclick = skipToErupt;
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? '播放' : '暫停'; };
document.getElementById('reset').onclick = () => {
  for (const k in P) { P[k].v = DEFAULTS[k]; document.getElementById('s_' + k).value = DEFAULTS[k]; document.getElementById('v_' + k).textContent = DEFAULTS[k]; }
  restart();
};
let lastMotion = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration; if (!a) return;
  const now = performance.now();
  if (Math.hypot(a.x || 0, a.y || 0, a.z || 0) > 22 && now - lastMotion > 500) { lastMotion = now; shake(); }
}
document.getElementById('motion').onclick = async e => {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
      if (await DeviceMotionEvent.requestPermission() !== 'granted') throw 0;
    }
    window.addEventListener('devicemotion', onMotion);
    e.target.textContent = '手機搖晃：開';
  } catch { e.target.textContent = '無法使用感應器'; }
};

// 背景圖載入後算出泥漿湖面的範圍
const lakeImg = document.querySelector('#lakeScene .bg-calm');
if (lakeImg.complete && lakeImg.naturalWidth) buildLakeMask(); else lakeImg.addEventListener('load', buildLakeMask);

restart();
</script>

<script>
// 參數面板：右上角按鈕（或手機畫面 header 的調整圖示）開關；網址加 ?dev 一進來就打開
(() => {
  const phone = document.getElementById('phone');
  // 畫面比例：等比 / 填滿（記在瀏覽器裡，下次打開一樣）
  let fitMode = 'fit';
  try { if (localStorage.getItem('migoFitMode') === 'fill') fitMode = 'fill'; } catch (e) {}
  const fit = () => {
    const dev = document.body.classList.contains('dev');
    const mobile = matchMedia('(max-width: 760px)').matches;
    const reset = () => { phone.style.transform = phone.style.clipPath = phone.style.margin = phone.style.transformOrigin = ''; phone.style.setProperty('--cropB', '0px'); };
    if (dev && !mobile) { reset(); phone.style.borderRadius = ''; return; }
    document.documentElement.style.overflow = !dev ? 'hidden' : '';   // 只玩遊戲時整頁鎖住，被裁掉的部分不能拖出來
    const vw = window.innerWidth, vh = window.innerHeight;
    // 等比：完整顯示不裁切，長或寬其中一邊剛好撐滿；填滿：撐滿整個畫面，多的裁掉（至少保留 350 寬、560 高，結算卡片一定看得到）
    let s = Math.min(vw / 390, vh / 844);
    if (fitMode === 'fill') s = Math.min(Math.max(vw / 390, vh / 844), vw / 350, vh / 560);
    const exW = Math.max(0, 390 - vw / s), exH = Math.max(0, 844 - vh / s);
    const cropL = exW / 2, cropT = Math.min(exH, 110), cropB = exH - cropT;   // 先裁上面的假狀態列／header，剩下才裁下面
    const offX = Math.max(0, (vw - 390 * s) / 2), offY = Math.max(0, (vh - 844 * s) / 2);
    phone.style.transformOrigin = '0 0';
    phone.style.transform = `translate(${(offX - cropL * s).toFixed(1)}px, ${(offY - cropT * s).toFixed(1)}px) scale(${s.toFixed(4)})`;
    phone.style.clipPath = `inset(${cropT.toFixed(1)}px ${cropL.toFixed(1)}px ${cropB.toFixed(1)}px ${cropL.toFixed(1)}px)`;
    phone.style.margin = `0 ${vw - 390}px ${(vh - 844).toFixed(1)}px 0`;   // 版面佔位 = 剛好一個螢幕，參數面板接在下面
    phone.style.borderRadius = (mobile || exW || exH || s < 1) ? '0' : '';
    phone.style.setProperty('--cropB', cropB.toFixed(1) + 'px');   // 下面被裁掉時，提示文字跟著往上
  };
  const btn = document.createElement('button');
  btn.className = 'panel-toggle';
  btn.type = 'button';
  const setOpen = open => {
    document.body.classList.toggle('dev', open);
    btn.textContent = open ? '✕ 關閉參數' : '⚙ 參數';
    btn.setAttribute('aria-expanded', open);
    fit();
  };
  btn.addEventListener('click', () => setOpen(!document.body.classList.contains('dev')));
  const bar = document.createElement('div');
  bar.className = 'top-right';
  const fitSw = document.createElement('button');
  fitSw.type = 'button';
  fitSw.className = 'fit-switch';
  fitSw.title = '畫面比例';
  fitSw.innerHTML = '<span>等比</span><span>填滿</span>';
  const syncFit = () => { fitSw.classList.toggle('fill', fitMode === 'fill'); fitSw.setAttribute('aria-label', fitMode === 'fill' ? '畫面比例：填滿' : '畫面比例：等比'); };
  fitSw.addEventListener('click', () => {
    fitMode = fitMode === 'fill' ? 'fit' : 'fill';
    try { localStorage.setItem('migoFitMode', fitMode); } catch (e) {}
    syncFit(); fit();
  });
  syncFit();
  bar.appendChild(fitSw); bar.appendChild(btn);
  document.body.appendChild(bar);
  // （遊戲畫面裡 header 的「調整」圖示不再能開面板：連點時容易誤觸，面板一開排版就變，下一下會點到滑桿把遊戲重來）
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  setOpen(new URLSearchParams(location.search).has('dev'));   // 預設收起；網址加 ?dev 則一進來就打開
})();
</script>

<script>
// AB toggle：點整顆就切到另一個遊戲（保留 ?play 等網址參數）
(() => {
  const nav = document.querySelector('.game-switch');
  nav.addEventListener('click', e => {
    e.preventDefault();
    const other = nav.querySelector('a:not(.on)');
    nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a === other));
    nav.classList.toggle('b', other === nav.querySelectorAll('a')[1]);
    setTimeout(() => { location.href = other.getAttribute('href') + location.search; }, 180);
  });
})();
</script>
