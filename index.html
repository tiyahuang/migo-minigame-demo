<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migo 小遊戲 DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #15132e; --card: #221f48; --text: #f1efff; --muted: #a9a4d6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, "Noto Sans TC", sans-serif; padding: 32px 16px 48px; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 900; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  a.card { display: block; background: var(--card); border-radius: 20px; overflow: hidden; color: inherit; text-decoration: none;
    transition: transform .15s; }
  a.card:hover { transform: translateY(-3px); }
  .thumb { aspect-ratio: 390 / 520; background-size: cover; background-position: center top; }
  .info { padding: 16px 18px 18px; }
  .info h2 { font-size: 18px; margin: 0 0 6px; }
  .info p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .how { margin-top: 28px; color: var(--muted); font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<main>
  <h1>Migo 小遊戲 DEMO</h1>
  <p class="sub">搖晃 VIVEE，幫 Migo 一把！手機打開體驗最好。</p>
  <div class="grid">
    <a class="card" href="migo_float_test/">
      <div class="thumb" style="background-image:url(migo_float_test/assets/bg_noisland.png)"></div>
      <div class="info">
        <h2>綿綿洞窟的神秘泉水</h2>
        <p>每搖一次水位就上漲，把浮島和 Migo 托向洞口，搖到密碼數字時泉水衝出洞口！</p>
      </div>
    </a>
    <a class="card" href="mud_spring_demo/">
      <div class="thumb" style="background-image:url(mud_spring_demo/assets/bg_lake.png)"></div>
      <div class="info">
        <h2>棉石泥漿島的噗噗泉</h2>
        <p>越搖泥漿越滾、浮島被晃得東倒西歪，搖到密碼數字時噗噗泉衝天噴發！</p>
      </div>
    </a>
  </div>
  <p class="how">玩法：點畫面或按空白鍵＝搖一下。手機上可以在網址後面加 <code>?dev</code> 打開參數面板。</p>
</main>
</body>
</html>
